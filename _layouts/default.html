<!DOCTYPE html>
<html>
  {% include head.html %}
  <body>
    {% include nav.html %}

    {% if page.toc==true %}
      <button id="toc-toggle" class="toc-toggle">隐藏目录</button>
      <aside class="toc">
        {% include toc.html html=content %}
      </aside>
    {% endif %}

    <div id="main" role="main" class="wrapper-content">
      <div class="container">
        {{ content }}
      </div>
    </div>

    {% include analytics.html %}
    
    {% include open-embed.html %}

<script>
(function() {
  var btn = document.getElementById('toc-toggle');
  if (!btn) return;
  if (localStorage.getItem('tocHidden') === '1') {
    document.body.classList.add('toc-hidden');
    btn.textContent = '显示目录';
  }
  btn.addEventListener('click', function() {
    document.body.classList.toggle('toc-hidden');
    var hidden = document.body.classList.contains('toc-hidden');
    btn.textContent = hidden ? '显示目录' : '隐藏目录';
    localStorage.setItem('tocHidden', hidden ? '1' : '0');
  });
})();
</script>
    
    </body>

  {% if page.toc==true %}
  <script>
    document.getElementById("main").classList.add("withtoc");
  </script>
  {% endif %}

  <div class="wrapper-footer-mobile">
    <footer class="footer">
      {% include footer.html %}
    </footer>
    
</html>
