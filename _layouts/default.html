<!DOCTYPE html>
<html>
  {% include head.html %}
  <body>
    {% include nav.html %}

    {% if page.toc==true %}
      <button id="toc-toggle" class="toc-toggle"></button>
      <aside class="toc">
        {% include toc.html html=content %}
      </aside>
    {% endif %}

    <div id="main" role="main" class="wrapper-content{% if page.toc==true %} withtoc{% endif %}">
      <div class="container">
        {{ content }}
      </div>
    </div>

    {% include analytics.html %}
    
    {% include open-embed.html %}

<script>
(function() {
  var btn = document.getElementById('toc-toggle');
  if (!btn) return;
  var root = document.documentElement;
  btn.setAttribute('title', root.classList.contains('toc-hidden') ? '显示目录' : '隐藏目录');
  btn.addEventListener('click', function() {
    root.classList.toggle('toc-hidden');
    var hidden = root.classList.contains('toc-hidden');
    btn.setAttribute('title', hidden ? '显示目录' : '隐藏目录');
    localStorage.setItem('tocHidden', hidden ? '1' : '0');
  });
})();
</script>

<script>
(function () {
  if (!window.matchMedia("(hover: hover)").matches) return;

  let pop = null;

  function showPop(img) {
    hidePop();
    pop = document.createElement("img");
    pop.src = img.currentSrc || img.src;
    pop.alt = "";
    pop.style.cssText =
      "position:fixed;z-index:9999;pointer-events:none;" +
      "width:160px;height:auto;background:#fff;" +
      "border:1px solid #ddd;border-radius:6px;padding:4px;" +
      "box-shadow:0 4px 12px rgba(0,0,0,.18);";

    document.body.appendChild(pop);

    const r = img.getBoundingClientRect();
    const pw = 168;
    const ph = pop.getBoundingClientRect().height || 120;

    let left = r.left + r.width / 2 - pw / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));

    let top = r.top - ph - 8;
    if (top < 8) top = r.bottom + 8;

    pop.style.left = left + "px";
    pop.style.top = top + "px";
  }

  function hidePop() {
    if (pop) {
      pop.remove();
      pop = null;
    }
  }

  document.querySelectorAll("table img").forEach(function (img) {
    img.addEventListener("mouseenter", function () { showPop(img); });
    img.addEventListener("mouseleave", hidePop);
    img.addEventListener("click", hidePop);
  });

  window.addEventListener("scroll", hidePop, true);
})();
</script>
    
    </body>

  <div class="wrapper-footer-mobile">
    <footer class="footer">
      {% include footer.html %}
    </footer>
    
</html>
