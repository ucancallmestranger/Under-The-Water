<!DOCTYPE html>
<html>
  {% include head.html %}
  <body>
    {% include nav.html %}

    {% if page.toc==true %}
      <button id="toc-toggle" class="toc-toggle">隐藏目录</button>
      <aside class="toc">
        {% include toc.html html=content %}
      </aside>
    {% endif %}

    <div id="main" role="main" class="wrapper-content{% if page.toc==true %} withtoc{% endif %}">
      <div class="container">
        {{ content }}
      </div>
    </div>

    {% include analytics.html %}
    
    {% include open-embed.html %}

<script>
(function() {
  var btn = document.getElementById('toc-toggle');
  if (!btn) return;
  var root = document.documentElement;
  btn.textContent = root.classList.contains('toc-hidden') ? '▶' : '◀';
  btn.setAttribute('title', root.classList.contains('toc-hidden') ? '显示目录' : '隐藏目录');
  btn.addEventListener('click', function() {
    root.classList.toggle('toc-hidden');
    var hidden = root.classList.contains('toc-hidden');
    btn.textContent = hidden ? '▶' : '◀';
    btn.setAttribute('title', hidden ? '显示目录' : '隐藏目录');
    localStorage.setItem('tocHidden', hidden ? '1' : '0');
  });
})();
</script>
    
    </body>

  <div class="wrapper-footer-mobile">
    <footer class="footer">
      {% include footer.html %}
    </footer>
    
</html>
